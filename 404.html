:root{--paper:#F6F3EC;--card:#FFFDF8;--ink:#111;--ink-2:#34322D;--muted:#6F6A5F;--line:rgba(17,17,17,.14);--blue:#2B73F3;--display:"Bricolage",ui-sans-serif,system-ui,sans-serif;--body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;--hand:"Caveat",cursive;--ease:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.logo{position:fixed;top:20px;left:20px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.04em;display:inline-flex;align-items:baseline;z-index:5}
.logo i{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 1.5px var(--ink);margin-left:3px;display:inline-block}
.wrap{width:min(560px,100% - 40px);margin:0 auto}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 0 64px}
.emo{width:92px;height:92px;margin:0 auto 22px;border-radius:50%;background:var(--blue);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font-size:44px;line-height:1}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,8vw,56px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
.lead{margin-top:16px;font-size:18px;line-height:1.5;color:var(--ink-2)}
.lead b{color:var(--ink);font-weight:700}
.lead a,.note a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;font-family:var(--body);font-size:17px;font-weight:700;border:2px solid var(--ink);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.btn-primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn-paper{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.6;cursor:default;transform:none}
.note{margin-top:18px;font-size:14px;line-height:1.5;color:var(--muted)}
